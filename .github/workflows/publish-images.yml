name: Publish HZ Images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-images.yml
      - services/**
      - crates/harness-server/**
      - harness/**
      - centaur_sdk/**
      - packages/**
      - tools/**
      - scripts/bootstrap-k8s-secrets.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .agents/skills/**
  workflow_dispatch:

concurrency:
  group: publish-hz-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: voytravel/centaur
  IMAGE_SOURCE: https://github.com/voytravel/centaur
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  publish:
    # Production image tags must always correspond to a commit on the protected
    # main branch. This also makes a manual run from a feature branch a no-op.
    if: github.ref == 'refs/heads/main'
    # Standard hosted runners include Docker/Buildx and give each public-repo
    # build a fresh VM, avoiding reliance on the shared ARC runner group.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: centaur-api-rs
            context: .
            dockerfile: services/api-rs/Dockerfile
            target: ""
          - image: centaur-slackbotv2
            context: .
            dockerfile: services/slackbotv2/Dockerfile
            target: ""
          - image: centaur-linearbot
            context: .
            dockerfile: services/linearbot/Dockerfile
            target: ""
          - image: centaur-agent
            context: .
            dockerfile: services/sandbox/Dockerfile
            target: sandbox
          - image: centaur-iron-proxy
            context: .
            dockerfile: services/iron-proxy/Dockerfile
            target: ""
          - image: centaur-console
            context: services/console
            dockerfile: services/console/Dockerfile
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,prefix=main-sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@ee4ca427a2f43b6a16632044ca514c076267da23 # v6.19.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_BUILD_PROFILE=release
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-release-manifest:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable HZ release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          image_tag="main-sha-${GITHUB_SHA:0:7}"
          release_tag="hz-images-${GITHUB_SHA}"
          manifest_path="$RUNNER_TEMP/centaur-hz-images.json"
          images_json='{}'
          images=(
            centaur-api-rs
            centaur-agent
            centaur-iron-proxy
            centaur-slackbotv2
            centaur-linearbot
            centaur-console
          )

          for image in "${images[@]}"; do
            repository="${REGISTRY}/${IMAGE_NAMESPACE}/${image}"
            reference="${repository}:${image_tag}"
            digest="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{json .Manifest}}' | jq -er '.digest'
            )"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected digest for ${reference}"
              exit 1
            fi
            images_json="$(
              jq -c \
                --arg image "$image" \
                --arg repository "$repository" \
                --arg tag "$image_tag" \
                --arg digest "$digest" \
                '. + {($image): {repository: $repository, tag: $tag, digest: $digest}}' \
                <<<"$images_json"
            )"
          done

          jq -n \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg image_tag "$image_tag" \
            --argjson images "$images_json" \
            '{
              schema_version: 1,
              source_repository: $source_repository,
              source_sha: $source_sha,
              image_tag: $image_tag,
              images: $images
            }' >"$manifest_path"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_dir="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_dir"
            gh release download "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern centaur-hz-images.json \
              --dir "$existing_dir"
            if ! cmp -s "$manifest_path" \
              "$existing_dir/centaur-hz-images.json"; then
              echo "::error::${release_tag} already has a different immutable manifest"
              exit 1
            fi
            echo "${release_tag} already contains the same immutable manifest"
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              "$manifest_path#centaur-hz-images.json" \
              --target "$GITHUB_SHA" \
              --title "Centaur HZ images ${GITHUB_SHA:0:7}" \
              --notes "Immutable image manifest produced from ${GITHUB_SHA}." \
              --prerelease
          fi
